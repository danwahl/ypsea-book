name: Build and Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'
        bundler-cache: true

    - name: Install dependencies
      run: bundle install

    - name: Build book formats
      run: bundle exec rake book:build

    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        draft: false
        prerelease: true

    - name: Upload release assets for all languages
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Get the release tag
        TAG="${GITHUB_REF#refs/tags/}"
        
        # Loop through each language directory
        for lang_dir in translations/*/; do
          lang=$(basename "$lang_dir")
          
          # Upload HTML
          if [ -f "./build/ypsea-book-${lang}.html" ]; then
            gh release upload "$TAG" "./build/ypsea-book-${lang}.html" --clobber
          fi
          
          # Upload EPUB
          if [ -f "./build/ypsea-book-${lang}.epub" ]; then
            gh release upload "$TAG" "./build/ypsea-book-${lang}.epub" --clobber
          fi
          
          # Upload PDF
          if [ -f "./build/ypsea-book-${lang}.pdf" ]; then
            gh release upload "$TAG" "./build/ypsea-book-${lang}.pdf" --clobber
          fi
        done

    - name: Prepare GitHub Pages directory structure
      run: |
        # Create language subdirectories and copy HTML files
        for lang_dir in translations/*/; do
          lang=$(basename "$lang_dir")
          mkdir -p "./build/${lang}"
          if [ -f "./build/ypsea-book-${lang}.html" ]; then
            cp "./build/ypsea-book-${lang}.html" "./build/${lang}/index.html"
          fi
        done
        
        # Copy English as root index.html for default access
        if [ -f "./build/ypsea-book-en.html" ]; then
          cp "./build/ypsea-book-en.html" "./build/index.html"
        fi

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./build
        publish_branch: gh-pages
        keep_files: false
        exclude_assets: '*.epub,*.pdf'
